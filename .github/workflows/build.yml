name: Test and build Windows app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath browser-extension -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Browser extension syntax check failed.' }
          }
          ./scripts/build-desktop.ps1 -PackageOnly
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAgentHub-win-x64
          path: release/MultiAgentHub-win-x64.zip
