name: Build standalone Hub IDE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned editor source
        shell: pwsh
        run: |
          $pin = Get-Content ide-product/upstream.json -Raw | ConvertFrom-Json
          "EDITOR_COMMIT=$($pin.commit)" >> $env:GITHUB_ENV
          "EDITOR_NODE=$($pin.node)" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ env.EDITOR_COMMIT }}
          path: .build/editor-source
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.EDITOR_NODE }}
          cache: npm
          cache-dependency-path: .build/editor-source/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiled Hub editor layer
        id: editor-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/VSCode-win32-x64
          key: hub-editor-win2022-x64-${{ hashFiles('ide-product/**', 'app.ico', 'scripts/build-hub-ide.ps1') }}
      - name: Install editor build dependencies
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-hub-ide.ps1 -EditorSource .build/editor-source -Phase Install
      - name: Compile Hub editor from source
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-hub-ide.ps1 -EditorSource .build/editor-source -Phase Compile
      - name: Cache compiled Hub editor layer
        if: steps.editor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/VSCode-win32-x64
          key: ${{ steps.editor-cache.outputs.cache-primary-key }}
      - name: Bundle editor Agent and backend
        shell: pwsh
        run: ./scripts/build-hub-ide.ps1 -EditorSource .build/editor-source -Phase Package
      - name: Verify own editor window and integrated Agent
        shell: pwsh
        run: |
          node tests-ide/desktop.integration.cjs '.build/VSCode-win32-x64/Hub Code.exe' '.build/VSCode-win32-x64/resources/app/hub-backend/MultiAgentHub.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Own editor/Agent startup failed.' }
      - name: Publish single EXE with own editor embedded
        shell: pwsh
        run: |
          $env:MULTI_AGENT_HUB_IDE_BUNDLE = (Resolve-Path release/hub-ide.zip).Path
          ./scripts/build-release.ps1 -SkipTests
          $exe = Get-ChildItem release/MultiAgentHub-*-win-x64.exe | Select-Object -First 1
          $prepare = Start-Process -FilePath $exe.FullName -ArgumentList @('--prepare-ide', '--data-dir', (Join-Path $env:RUNNER_TEMP 'hub-bundle-profile')) -Wait -PassThru -WindowStyle Hidden
          if ($prepare.ExitCode -ne 0) { throw 'Embedded editor extraction/product validation failed.' }
          node tests-ide/backend.integration.cjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Packaged backend integration failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAgentHub-standalone-win-x64
          compression-level: 0
          path: |
            release/MultiAgentHub-*-win-x64.exe
            release/MultiAgentHub-*-win-x64.exe.sha256
            release/hub-ide.zip.json
